spring.application.name=pedidos-service

# Puerto del microservicio. El frontend NO lo llama directo: pasa por el
# API Manager (AWS API Gateway), que valida el JWT antes de reenviar aquí.
server.port=8080

# --- Base de datos ---
# Las credenciales salen de variables de entorno; los valores por defecto son
# para desarrollo local (docker-compose). En la nube (RDS / Azure Database) se
# cambian solo estas variables, sin tocar el código.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/pedidos360}
spring.datasource.username=${DB_USER:pedidos}
spring.datasource.password=${DB_PASSWORD:pedidos_dev}

# Hibernate crea/actualiza el esquema a partir de las entidades (dev). En
# producción se recomienda 'validate' + migraciones controladas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Seguridad: validación del JWT de Azure AD (Entra ID) ---
# El token debe venir firmado por este tenant (issuer), estar dirigido a esta API
# (audience) y estar vigente (exp/nbf). Valores por variables de entorno para no
# tocar código al cambiar de tenant.
azure.tenant-id=${AZURE_TENANT_ID:bb5324af-c266-41ed-b36c-a971641c7af2}
azure.api-client-id=${AZURE_API_CLIENT_ID:dfc2eb27-c1cb-4ba8-b865-13c5b0be371b}
app.security.issuer=https://login.microsoftonline.com/${azure.tenant-id}/v2.0
app.security.jwk-set-uri=https://login.microsoftonline.com/${azure.tenant-id}/discovery/v2.0/keys
app.security.audience=${azure.api-client-id}
